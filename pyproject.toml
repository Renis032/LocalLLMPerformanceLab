[project]
name = "llm-perf-lab"
version = "0.1.0"
description = "Benchmarking lab for local LLM inference"
requires-python = ">=3.13"
dependencies = [
    "httpx",
    "nvidia-ml-py",
    "psutil",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
# Machine-specific uv settings (cache location, link mode) go in an untracked uv.toml.

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
