<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 392" width="860" height="392" role="img" aria-labelledby="t d">
<title id="t">Claude is right far more often; the local model costs about 8× less per correct answer</title>
<desc id="d">24 tasks, three repeats each, graded by code. SmolLM3 3B, Q4_K_M: 51% correct, 149 tokens per second, $0.000017 per correct answer; Claude Haiku 5.5: 97% correct, 195 tokens per second, $0.00014 per correct answer; Claude Sonnet 5.5: 96% correct, 126 tokens per second, $0.0023 per correct answer; Claude Opus 5.5: 96% correct, 95 tokens per second, $0.0044 per correct answer.</desc>
<style>
  .root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
          --cloud: #2a78d6; --local: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .root { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
            --cloud: #3987e5; --local: #d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 20px; font-weight: 600; }
  .sub { font-size: 14px; }
  .ptitle { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .name { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .where { fill: var(--muted); font-size: 12px; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .whisk { stroke: var(--ink2); stroke-width: 1.5; stroke-linecap: round; }
  .local { fill: var(--local); } .cloud { fill: var(--cloud); }
  .note { fill: var(--muted); font-size: 12px; }
</style>
<g class="root">
<rect class="bg" width="860" height="392" rx="8"/>
<text class="title" x="24" y="36">Claude is right far more often; the local model costs about 8× less per correct answer</text>
<text class="sub" x="24" y="60">24 original tasks, three repeats each, every answer graded by code against a known answer.</text>
<text class="sub" x="24" y="78">Exact match, JSON, coding against hidden tests, multi-step reasoning. Lines show the 95% interval.</text>
<rect class="local" x="24" y="96" width="14" height="14" rx="3"/><text x="44" y="108">On this PC (llama.cpp, RTX 3060 Ti)</text>
<rect class="cloud" x="300" y="96" width="14" height="14" rx="3"/><text x="320" y="108">Anthropic cloud, through Claude Code on a Claude plan</text>
<text class="name" x="24" y="186">SmolLM3 3B, Q4_K_M</text><text class="where" x="24" y="201">this PC, RTX 3060 Ti</text><text class="name" x="24" y="224">Claude Haiku 5.5</text><text class="where" x="24" y="239">Anthropic cloud</text><text class="name" x="24" y="262">Claude Sonnet 5.5</text><text class="where" x="24" y="277">Anthropic cloud</text><text class="name" x="24" y="300">Claude Opus 5.5</text><text class="where" x="24" y="315">Anthropic cloud</text>
<text class="ptitle" x="210" y="154">Answer quality, % of tasks correct</text><line class="axis" x1="210.0" x2="210.0" y1="166" y2="312"/><text class="tick" x="210.0" y="328" text-anchor="middle">0%</text><line class="grid" x1="300.0" x2="300.0" y1="166" y2="312"/><text class="tick" x="300.0" y="328" text-anchor="middle">50%</text><line class="grid" x1="390.0" x2="390.0" y1="166" y2="312"/><text class="tick" x="390.0" y="328" text-anchor="middle">100%</text><path class="local" d="M210.0,172.0 H298.5 Q302.5,172.0 302.5,176.0 V188.0 Q302.5,192.0 298.5,192.0 H210.0 Z"><title>SmolLM3 3B, Q4_K_M: 51% (95% interval 33% to 69%)</title></path><line class="whisk" x1="270.0" x2="335.0" y1="182.0" y2="182.0"/><line class="whisk" x1="270.0" x2="270.0" y1="178.0" y2="186.0"/><line class="whisk" x1="335.0" x2="335.0" y1="178.0" y2="186.0"/><text class="val" x="341.0" y="187">51%</text><path class="cloud" d="M210.0,210.0 H381.0 Q385.0,210.0 385.0,214.0 V226.0 Q385.0,230.0 381.0,230.0 H210.0 Z"><title>Claude Haiku 5.5: 97% (95% interval 92% to 100%)</title></path><line class="whisk" x1="375.0" x2="390.0" y1="220.0" y2="220.0"/><line class="whisk" x1="375.0" x2="375.0" y1="216.0" y2="224.0"/><line class="whisk" x1="390.0" x2="390.0" y1="216.0" y2="224.0"/><text class="val" x="396.0" y="225">97%</text><path class="cloud" d="M210.0,248.0 H378.5 Q382.5,248.0 382.5,252.0 V264.0 Q382.5,268.0 378.5,268.0 H210.0 Z"><title>Claude Sonnet 5.5: 96% (95% interval 88% to 100%)</title></path><line class="whisk" x1="367.5" x2="390.0" y1="258.0" y2="258.0"/><line class="whisk" x1="367.5" x2="367.5" y1="254.0" y2="262.0"/><line class="whisk" x1="390.0" x2="390.0" y1="254.0" y2="262.0"/><text class="val" x="396.0" y="263">96%</text><path class="cloud" d="M210.0,286.0 H378.5 Q382.5,286.0 382.5,290.0 V302.0 Q382.5,306.0 378.5,306.0 H210.0 Z"><title>Claude Opus 5.5: 96% (95% interval 88% to 100%)</title></path><line class="whisk" x1="367.5" x2="390.0" y1="296.0" y2="296.0"/><line class="whisk" x1="367.5" x2="367.5" y1="292.0" y2="300.0"/><line class="whisk" x1="390.0" x2="390.0" y1="292.0" y2="300.0"/><text class="val" x="396.0" y="301">96%</text>
<text class="ptitle" x="430" y="154">Speed, tokens/s</text><line class="axis" x1="430.0" x2="430.0" y1="166" y2="312"/><text class="tick" x="430.0" y="328" text-anchor="middle">0</text><line class="grid" x1="510.0" x2="510.0" y1="166" y2="312"/><text class="tick" x="510.0" y="328" text-anchor="middle">100</text><line class="grid" x1="590.0" x2="590.0" y1="166" y2="312"/><text class="tick" x="590.0" y="328" text-anchor="middle">200</text><path class="local" d="M430.0,172.0 H545.0 Q549.0,172.0 549.0,176.0 V188.0 Q549.0,192.0 545.0,192.0 H430.0 Z"><title>SmolLM3 3B, Q4_K_M: 149 tokens/s</title></path><text class="val" x="555.0" y="187">149</text><path class="cloud" d="M430.0,210.0 H581.8 Q585.8,210.0 585.8,214.0 V226.0 Q585.8,230.0 581.8,230.0 H430.0 Z"><title>Claude Haiku 5.5: 195 tokens/s</title></path><text class="val" x="591.8" y="225">195</text><path class="cloud" d="M430.0,248.0 H526.5 Q530.5,248.0 530.5,252.0 V264.0 Q530.5,268.0 526.5,268.0 H430.0 Z"><title>Claude Sonnet 5.5: 126 tokens/s</title></path><text class="val" x="536.5" y="263">126</text><path class="cloud" d="M430.0,286.0 H502.2 Q506.2,286.0 506.2,290.0 V302.0 Q506.2,306.0 502.2,306.0 H430.0 Z"><title>Claude Opus 5.5: 95 tokens/s</title></path><text class="val" x="512.2" y="301">95</text>
<text class="ptitle" x="632" y="154">Cost per correct answer (log)</text><line class="grid" x1="632.0" x2="632.0" y1="166" y2="312"/><text class="tick" x="632.0" y="328" text-anchor="middle">$0.00001</text><line class="grid" x1="681.3" x2="681.3" y1="166" y2="312"/><text class="tick" x="681.3" y="328" text-anchor="middle">$0.0001</text><line class="grid" x1="730.7" x2="730.7" y1="166" y2="312"/><text class="tick" x="730.7" y="328" text-anchor="middle">$0.001</text><line class="grid" x1="780.0" x2="780.0" y1="166" y2="312"/><text class="tick" x="780.0" y="328" text-anchor="middle">$0.01</text><circle class="local" cx="643.1" cy="182.0" r="7"><title>SmolLM3 3B, Q4_K_M: $0.000017</title></circle><text class="val" x="655.1" y="187">$0.000017</text><circle class="cloud" cx="687.9" cy="220.0" r="7"><title>Claude Haiku 5.5: $0.00014</title></circle><text class="val" x="699.9" y="225">$0.00014</text><circle class="cloud" cx="748.6" cy="258.0" r="7"><title>Claude Sonnet 5.5: $0.0023</title></circle><text class="val" x="760.6" y="263">$0.0023</text><circle class="cloud" cx="762.6" cy="296.0" r="7"><title>Claude Opus 5.5: $0.0044</title></circle><text class="val" x="774.6" y="301">$0.0044</text>
<text class="note" x="24" y="354">Cost ratio is against Claude Haiku 5.5. Claude's cost is the API list price (these runs used a plan). The local cost is GPU electricity at $0.20/kWh:</text>
<text class="note" x="24" y="371">an estimate, GPU board only, excluding the price of the GPU. A 3B model is expected to score below Claude; later phases ask what each local setting gives up.</text>
</g>
</svg>
