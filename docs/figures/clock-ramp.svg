<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 432" width="820" height="432" role="img" aria-labelledby="t d">
<title id="t">Same GPU, same model: 154 vs 97 tokens per second</title>
<desc id="d">GPU clock during five measured runs of SmolLM3 3B on an RTX 3060 Ti. Run back to back with a 0.1 second pause, the clock holds near 1,950 MHz and generation runs at 154 tokens per second. With a 1 second pause, the clock falls to about 780 MHz in every pause and climbs only to about 1,200 MHz during each run, so generation runs at 97 tokens per second.</desc>
<style>
  .root { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7;
          --s1: #2a78d6; --s2: #eb6834; }
  @media (prefers-color-scheme: dark) {
    .root { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
            --s1: #3987e5; --s2: #d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 20px; font-weight: 600; }
  .sub { font-size: 14px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .fast, .slow { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .fast { stroke: var(--s1); } .slow { stroke: var(--s2); }
  .fast-dot { fill: var(--s1); } .slow-dot { fill: var(--s2); }
  .ring { fill: var(--surface); }
  .lbl-strong { fill: var(--ink); font-weight: 600; font-size: 14px; }
  .lbl { fill: var(--ink2); font-size: 13px; }
  .note { fill: var(--muted); font-size: 12px; }
  .leader { stroke: var(--muted); stroke-width: 1; }
</style>
<g class="root">
<rect class="bg" width="820" height="432" rx="8"/>
<text class="title" x="24" y="36">Same GPU, same model: 154 vs 97 tokens per second</text>
<text class="sub" x="24" y="60">The only difference is the pause between runs. After 1 s idle the GPU drops to a power-saving</text>
<text class="sub" x="24" y="78">state and ramps back too slowly, so every run is measured well below full speed.</text>
<line class="fast" x1="24" x2="44" y1="100" y2="100"/><text x="50" y="104">0.1 s pause between runs</text>
<line class="slow" x1="230" x2="250" y1="100" y2="100"/><text x="256" y="104">1 s pause between runs</text>
<text class="tick" x="62" y="130" text-anchor="end">MHz</text>
<line class="axis" x1="70" x2="640" y1="372.0" y2="372.0"/><text class="tick" x="62" y="376.0" text-anchor="end">0</text><line class="grid" x1="70" x2="640" y1="319.3" y2="319.3"/><text class="tick" x="62" y="323.3" text-anchor="end">500</text><line class="grid" x1="70" x2="640" y1="266.5" y2="266.5"/><text class="tick" x="62" y="270.5" text-anchor="end">1,000</text><line class="grid" x1="70" x2="640" y1="213.8" y2="213.8"/><text class="tick" x="62" y="217.8" text-anchor="end">1,500</text><line class="grid" x1="70" x2="640" y1="161.1" y2="161.1"/><text class="tick" x="62" y="165.1" text-anchor="end">2,000</text><text class="tick" x="70.0" y="392" text-anchor="middle">0</text><text class="tick" x="151.4" y="392" text-anchor="middle">5</text><text class="tick" x="232.9" y="392" text-anchor="middle">10</text><text class="tick" x="314.3" y="392" text-anchor="middle">15</text><text class="tick" x="395.7" y="392" text-anchor="middle">20</text><text class="tick" x="477.1" y="392" text-anchor="middle">25</text><text class="tick" x="558.6" y="392" text-anchor="middle">30</text><text class="tick" x="640.0" y="392" text-anchor="middle">35</text>
<text class="tick" x="355" y="414" text-anchor="middle">GPU clock, seconds since the first measured run (RTX 3060 Ti, SmolLM3 3B Q4_K_M, 512 tokens per run)</text>
